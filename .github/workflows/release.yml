name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_developer_verification_status:
        description: 'Release-note status for Android developer verification'
        required: false
        default: 'owner-confirmation-required'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/freevibe-release.jks
      RELEASE_DIR: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate release signing secrets
        env:
          AURA_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURA_RELEASE_KEYSTORE_BASE64 }}
          AURA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AURA_RELEASE_KEYSTORE_PASSWORD }}
          AURA_RELEASE_KEY_ALIAS: ${{ secrets.AURA_RELEASE_KEY_ALIAS }}
          AURA_RELEASE_KEY_PASSWORD: ${{ secrets.AURA_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in AURA_RELEASE_KEYSTORE_BASE64 AURA_RELEASE_KEYSTORE_PASSWORD AURA_RELEASE_KEY_ALIAS AURA_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release secret::$name is required for signed release APKs"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        env:
          AURA_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AURA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Write release local.properties
        env:
          AURA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AURA_RELEASE_KEYSTORE_PASSWORD }}
          AURA_RELEASE_KEY_ALIAS: ${{ secrets.AURA_RELEASE_KEY_ALIAS }}
          AURA_RELEASE_KEY_PASSWORD: ${{ secrets.AURA_RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'pexels.api.key=\n'
            printf 'pixabay.api.key=\n'
            printf 'freesound.api.key=\n'
            printf 'soundcloud.client.id=\n'
            printf 'stability.ai.key=\n'
            printf 'signing.keystore.path=%s\n' "$KEYSTORE_PATH"
            printf 'signing.keystore.password=%s\n' "$AURA_RELEASE_KEYSTORE_PASSWORD"
            printf 'signing.key.alias=%s\n' "$AURA_RELEASE_KEY_ALIAS"
            printf 'signing.key.password=%s\n' "$AURA_RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Package release APK
        id: package
        run: |
          mkdir -p "$RELEASE_DIR"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error title=Version parse failed::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          RELEASE_LABEL="v$VERSION_NAME"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_LABEL="$GITHUB_REF_NAME"
          fi

          APK_SOURCE="$(find app/build/outputs/apk/release -name '*release*.apk' ! -name '*unsigned*.apk' | sort | head -1)"
          if [ -z "$APK_SOURCE" ]; then
            echo "::error title=Release APK missing::No signed release APK found under app/build/outputs/apk/release"
            exit 1
          fi

          APK_NAME="Aura-${RELEASE_LABEL}-versionCode-${VERSION_CODE}-universal-release.apk"
          APK_DEST="$RELEASE_DIR/$APK_NAME"
          cp "$APK_SOURCE" "$APK_DEST"

          {
            echo "apk_path=$APK_DEST"
            echo "apk_name=$APK_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "release_label=$RELEASE_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Generate third-party notices
        run: |
          ./gradlew :app:releaseOssLicensesTask --stacktrace --no-daemon
          python3 tools/dependency_notice_lock.py --mode check --lockfile docs/legal/dependency-notices.lock.json
          python3 tools/native_compliance_inventory.py --mode check-lock --lockfile docs/legal/native-compliance.lock.json
          python3 tools/dependency_overlay_check.py --overlay docs/legal/dependency-notice-overrides.json
          python3 tools/google_oss_to_markdown.py --variant release --output "$RELEASE_DIR/THIRD-PARTY-NOTICES.md"
          test -s "$RELEASE_DIR/THIRD-PARTY-NOTICES.md"
          python3 tools/native_compliance_inventory.py --apk "${{ steps.package.outputs.apk_path }}" --output "$RELEASE_DIR/NATIVE-COMPLIANCE.md"
          test -s "$RELEASE_DIR/NATIVE-COMPLIANCE.md"

      - name: Verify release APK
        id: verify_apk
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$AAPT" ]; then
            echo "::error title=Android build tools missing::apksigner and aapt are required"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "${{ steps.package.outputs.apk_path }}" > "$RELEASE_DIR/apksigner.txt"
          cat "$RELEASE_DIR/apksigner.txt"
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}' "$RELEASE_DIR/apksigner.txt")"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error title=Certificate fingerprint missing::apksigner did not print a SHA-256 certificate digest"
            exit 1
          fi

          "$AAPT" dump badging "${{ steps.package.outputs.apk_path }}" > "$RELEASE_DIR/aapt-badging.txt"
          if grep -q 'application-debuggable' "$RELEASE_DIR/aapt-badging.txt"; then
            echo "::error title=Debuggable APK rejected::Release artifacts must have android:debuggable=false"
            exit 1
          fi

          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          (
            cd "$RELEASE_DIR"
            sha256sum "${{ steps.package.outputs.apk_name }}" THIRD-PARTY-NOTICES.md NATIVE-COMPLIANCE.md > SHA256SUMS.txt
          )

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Generate release notes
        env:
          ANDROID_DEVELOPER_VERIFICATION_STATUS: ${{ github.event.inputs.android_developer_verification_status }}
        run: |
          APK_SHA256="$(cut -d ' ' -f 1 "$RELEASE_DIR/SHA256SUMS.txt")"
          DEV_VERIFICATION_STATUS="${ANDROID_DEVELOPER_VERIFICATION_STATUS:-owner-confirmation-required}"
          {
            printf 'Aura %s (versionCode %s)\n\n' '${{ steps.package.outputs.version_name }}' '${{ steps.package.outputs.version_code }}'
            printf 'Signed release artifact:\n'
            printf -- '- APK: %s\n' '${{ steps.package.outputs.apk_name }}'
            printf -- '- APK SHA-256: %s\n' "$APK_SHA256"
            printf -- '- Third-party notices: THIRD-PARTY-NOTICES.md\n'
            printf -- '- Native compliance packet: NATIVE-COMPLIANCE.md\n'
            printf -- '- Signing certificate SHA-256: %s\n' '${{ steps.verify_apk.outputs.cert_sha256 }}'
            printf -- '- GitHub artifact attestation: %s\n' '${{ steps.attest.outputs.attestation-url }}'
            printf -- '- Build type: release, android:debuggable=false\n\n'
            printf 'Android developer verification:\n'
            printf -- '- Package: com.freevibe\n'
            printf -- '- Status: %s\n' "$DEV_VERIFICATION_STATUS"
            printf -- '- Owner runbook: docs/distribution/developer-verification.md\n\n'
            printf 'GitHub Releases and Obtainium should install the signed release APK. Debug APKs are development-only and are not published by this workflow.\n'
          } > "$RELEASE_DIR/RELEASE_NOTES.md"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-${{ steps.package.outputs.version_name }}-${{ github.run_number }}
          path: |
            release/*.apk
            release/THIRD-PARTY-NOTICES.md
            release/NATIVE-COMPLIANCE.md
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
            release/apksigner.txt
            release/aapt-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.apk
            release/THIRD-PARTY-NOTICES.md
            release/NATIVE-COMPLIANCE.md
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
