name: Performance benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-profile-and-macrobenchmark:
    runs-on: [self-hosted, linux, android, physical-device]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Stub local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pexels.api.key="
            echo "pixabay.api.key="
            echo "freesound.api.key="
            echo "soundcloud.client.id="
            echo "stability.ai.key="
          } > local.properties

      - name: List adb devices
        run: adb devices -l

      - name: Generate Baseline Profile
        run: ./gradlew :app:generateBaselineProfile --stacktrace --no-daemon -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile

      - name: Run startup and grid macrobenchmarks
        run: ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest --stacktrace --no-daemon -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-performance-${{ github.run_number }}
          path: |
            app/src/main/generated/baselineProfiles/**
            baselineprofile/build/outputs/**
            baselineprofile/build/reports/**
          if-no-files-found: warn
          retention-days: 30
