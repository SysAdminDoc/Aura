name: Verify (build + unit tests + lint)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Firebase rules changes
        id: firebase_rules_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" "$GITHUB_SHA" -- \
            database.rules.json \
            storage.rules \
            firebase.json \
            functions \
            package.json \
            package-lock.json \
            test/firebase \
            test/tools \
            tools/community_backend_manifest.py \
            tools/community_callable_contract_check.py \
            tools/community_callable_wire_protocol_check.py \
            tools/community_callable_rollout_receipt.py \
            tools/community_account_deletion_plan.py \
            tools/community_deletion_request_lookup.py \
            tools/community_deletion_web_intake.py \
            tools/community_deletion_web_page_check.py \
            tools/community_account_deletion_review.py \
            tools/community_account_deletion_apply_simulator.py \
            tools/community_account_deletion_executor_package.py \
            tools/community_account_deletion_rest_executor.py \
            tools/community_account_deletion_completion_receipt.py \
            tools/community_account_deletion_cleanup_sequence.py \
            tools/community_account_deletion_auth_package.py \
            tools/community_account_deletion_auth_execution_receipt.py \
            tools/community_account_deletion_upload_plan.py \
            tools/community_account_deletion_upload_execution_receipt.py \
            tools/community_deletion_web_url_check.py \
            tools/community_upload_backfill_plan.py \
            tools/community_storage_orphan_report.py \
            docs/community-backend-manifest.json \
            docs/community-backend-runbook.md \
            docs/community-callable-contract.json \
            docs/community-callable-wire-protocol.json \
            docs/community-callable-rollout-evidence.md \
            docs/community-account-deletion-policy.md \
            docs/privacy/privacy-policy.md \
            docs/support/community-account-deletion-web-page.md \
            docs/support/community-account-deletion-web-url.json \
            docs/community-upload-backfill.md \
            docs/community-storage-lifecycle-policy.md \
            docs/firebase-rules-harness.md \
            docs/firebase-admin-claims.md \
            .github/workflows/verify.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Community backend manifest
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 tools/community_backend_manifest.py --mode check

      - name: Community callable contract manifest
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 tools/community_callable_contract_check.py --contract docs/community-callable-contract.json

      - name: Community callable wire protocol
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 tools/community_callable_wire_protocol_check.py --contract docs/community-callable-contract.json --protocol docs/community-callable-wire-protocol.json

      - name: Community account deletion web URL manifest
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 tools/community_deletion_web_url_check.py --manifest docs/support/community-account-deletion-web-url.json --repo-root .

      - name: Community account deletion web page
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 tools/community_deletion_web_page_check.py --page docs/support/community-account-deletion-web-page.md

      - name: Community backend tool tests
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: python3 -m unittest discover -s test/tools -p '*_test.py'

      - name: Install Firebase rules dependencies
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: npm ci

      - name: Install Firebase functions dependencies
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: npm --prefix functions ci

      - name: Firebase functions tests
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: npm run test:functions

      - name: Firebase functions emulator tests
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: npm run test:functions-emulator

      - name: Firebase rules tests
        if: steps.firebase_rules_changes.outputs.changed == 'true'
        run: npm run test:firebase-rules

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitHub security workflow policy
        run: python3 tools/github_security_workflow_check.py --policy docs/distribution/github-security-workflows.json --repo-root .

      - name: GitHub Actions allowlist
        run: python3 tools/github_actions_allowlist_check.py --policy docs/distribution/github-actions-allowlist.json --repo-root .

      - name: Dependabot update policy
        run: python3 tools/dependabot_config_check.py --config .github/dependabot.yml

      - name: Gradle wrapper policy
        run: python3 tools/gradle_wrapper_check.py --properties gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Stub local.properties so signing config lookups don't fail in CI.
      # CI never produces signed release artifacts (release.yml owns that path).
      - name: Stub local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "pexels.api.key="
            echo "pixabay.api.key="
            echo "freesound.api.key="
            echo "soundcloud.client.id="
            echo "stability.ai.key="
          } > local.properties

      - name: Dependency notice drift
        run: |
          ./gradlew :app:releaseOssLicensesTask --stacktrace --no-daemon
          python3 tools/dependency_notice_lock.py --mode check --lockfile docs/legal/dependency-notices.lock.json
          python3 tools/dependency_notice_lock.py --mode check-metadata --lockfile docs/legal/dependency-notices.lock.json
          python3 tools/native_compliance_inventory.py --mode check-lock --lockfile docs/legal/native-compliance.lock.json
          python3 tools/dependency_overlay_check.py --overlay docs/legal/dependency-notice-overrides.json
          python3 tools/dependency_license_policy.py --policy docs/legal/dependency-license-policy.json --overlay docs/legal/dependency-notice-overrides.json

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests (debug)
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
